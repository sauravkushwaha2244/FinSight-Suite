services:
  # Backend FastAPI Service on Render
  - type: web
    name: finsight-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app,https://finsight-suite.vercel.app"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE_FALLBACK
        value: "true"
