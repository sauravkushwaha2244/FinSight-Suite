services:
  - type: web
    name: finsight-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: finsight-suite/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BACKEND_URL
        value: https://finsight-backend.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_MODE_FALLBACK
        value: "true"
      - key: ACTIVE_MODEL_VERSION
        value: "1.0.0"
      - key: MODEL_BUCKET
        value: ml-models
